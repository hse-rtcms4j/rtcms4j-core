spring:
  cache:
    type: redis
  liquibase:
    enabled: false
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    default-property-inclusion: non_null
  redis:
    timeout: 500ms
    lettuce:
      pool:
        max-wait: 500ms

server:
  port: 8080

access-token:
  prefix: AT.

key-val-repository:
  global-prefix: RTCMS4J_CORE_SCOPE_
  topic: NOTIFY_EVENT_TOPIC

json:
  meta-schema-class-path: json/schema/meta-schema.json
  version-field:
    name: version
    pattern: ^.*$

default:
  pagination:
    page-size: 10

roles:
  super-admin-role: rtcms4j-super-admin

cache:
  keycloak-users-ttl: 10m
  available-resources-ttl: 1h

job:
  keycloak-retry:
    cron: "0 */5 * * * *"
    batch-size: 10
    max-attempts: 90
